name: Publish image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          buildah bud \
            --tag "$image:latest" \
            --tag "$image:$GITHUB_SHA" \
            --file Containerfile \
            .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s' "$GITHUB_TOKEN" | buildah login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          buildah push "$image:latest"
          buildah push "$image:$GITHUB_SHA"
